name: Bug report
description: Something in Radial for Mac doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting this. Please send security problems privately (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: App version
      description: In the app menu, choose About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Cursor
        - Not related to an agent
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which app
      options:
        - The official app from radial.to
        - A build from source (Radial Dev)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, error messages, or what the site is built with.
